{% extends "base.html" %}

{% block title %}Sign In | Puneeth Vehicle Services{% endblock %}

{% block content %}
<div class="py-5" style="background: linear-gradient(135deg, #0B132B 0%, #1C2541 100%); min-height: 80vh; display: flex; align-items: center;">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-navy text-white text-center py-4 border-bottom border-warning border-3">
                        <div class="brand-badge mx-auto mb-2" style="background: var(--accent-orange); color: white; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 1.25rem;">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <h4 class="fw-bold mb-1">Puneeth Vehicle Services</h4>
                        <p class="text-light opacity-75 small mb-0">Secure Portal Access (Admin, Mechanic, Customer)</p>
                    </div>

                    <div class="card-body p-4 p-md-5 bg-white">
                        <!-- Quick Role Autofill Buttons for Testing -->
                        <div class="mb-4 text-center">
                            <small class="text-muted d-block mb-2 fw-semibold">Quick Demo Login Presets:</small>
                            <div class="btn-group btn-group-sm w-100" role="group">
                                <button type="button" class="btn btn-outline-secondary" onclick="presetLogin('admin', 'admin123', 'admin')">
                                    <i class="fa-solid fa-shield-halved text-danger me-1"></i> Admin
                                </button>
                                <button type="button" class="btn btn-outline-secondary" onclick="presetLogin('mechanic_rajesh', 'mechanic123', 'mechanic')">
                                    <i class="fa-solid fa-wrench text-warning me-1"></i> Mechanic
                                </button>
                                <button type="button" class="btn btn-outline-secondary" onclick="presetLogin('customer_arun', 'customer123', 'customer')">
                                    <i class="fa-solid fa-user text-primary me-1"></i> Customer
                                </button>
                            </div>
                        </div>

                        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                            <div class="mb-3">
                                <label class="form-label fw-bold small text-secondary">Username or Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" name="login_id" id="login_id" class="form-control" placeholder="Enter username or email" value="{{ login_id or '' }}" required autofocus>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small text-secondary">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-key"></i></span>
                                    <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold small text-secondary">Role (Optional Filter)</label>
                                <select name="role" id="role" class="form-select text-secondary">
                                    <option value="">Any / Auto-Detect Role</option>
                                    <option value="customer">Customer</option>
                                    <option value="mechanic">Mechanic</option>
                                    <option value="admin">Administrator</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-orange w-100 py-2 fw-bold">
                                <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In to Account
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <span class="text-muted small">New to Puneeth Vehicle Services? </span>
                            <a href="{{ url_for('auth.register') }}" class="text-orange fw-bold small text-decoration-none">
                                Register as Customer
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function presetLogin(username, pwd, role) {
    document.getElementById('login_id').value = username;
    document.getElementById('password').value = pwd;
    if (role) {
        document.getElementById('role').value = role;
    }
}
</script>
{% endblock %}
